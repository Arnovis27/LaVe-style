<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para ti</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Pantalla de bienvenida con el primer GIF y el botón -->
    <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-content">
            <img src="https://i.pinimg.com/originals/04/34/b4/0434b4740ae50bf12654f565bf4b8b3a.gif" alt="Corazón animado" class="surprise-gif">
            <button id="start-btn" class="surprise-btn" disabled>Cargando música... ⏳</button>
        </div>
    </div>

    <!-- Contenedor del texto (sin corazón al lado) y el segundo GIF que aparecen al finalizar -->
    <div id="love-container" class="love-container hidden">
        <h1 class="love-text">TE AMO</h1>
        <img src="https://i.pinimg.com/originals/e4/df/ad/e4dfad9c0c0908b7605bcab367cf379b.gif" alt="Corazón tierno" class="second-gif">
    </div>

    <!-- Elemento de audio local -->
    <audio id="bg-audio" src="perfect.mp3" preload="auto" x5-playsinline playsinline></audio>

    <!-- Lienzo interactivo -->
    <canvas id="heartCanvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
